name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [16, 20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Check script syntax
        shell: bash
        run: for file in scripts/*.mjs scripts/lib/*.mjs tests/*.mjs tests/lib/*.mjs; do node --check "$file"; done
      - name: Run zero-dependency test suite
        run: npm test

  node-16-0-0:
    name: ubuntu-latest / node 16.0.0 (declared floor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the floor Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 16.0.0
      - name: Verify the floor runtime and run the zero-dependency test suite
        run: |
          test "$(node -p process.version)" = "v16.0.0"
          npm test

  windows-node-22-14:
    name: windows-latest / node 22.14.0 (libuv 1.49.2)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up affected Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
      - name: Verify affected runtime and run zero-dependency test suite
        shell: pwsh
        run: |
          if ((node -p "process.version") -ne "v22.14.0") { throw "wrong Node version" }
          if ((node -p "process.versions.uv") -ne "1.49.2") { throw "wrong libuv version" }
          npm test
